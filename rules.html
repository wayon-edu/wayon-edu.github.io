<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png"><link rel="apple-touch-icon" href="./favicon-180.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Wayon-edu · 任务规则</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      color-scheme: light dark;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
      --canvas-light: #F5F5F7;
      --canvas-dark: #000000;
      --surface-light: #FFFFFF;
      --surface-dark: #1C1C1E;
      --fg-light: #1D1D1F;
      --fg-dark: #F5F5F7;
      --fg2-light: #6E6E73;
      --fg2-dark: #98989D;
      --accent-light: #0071E3;
      --accent-dark: #2997FF;
      --accent-hover-light: #0077ED;
      --accent-hover-dark: #4CA8FF;
      --danger-light: #D70015;
      --danger-dark: #FF6961;
      --glass-top-light: rgba(255, 255, 255, 0.78);
      --glass-top-dark: rgba(38, 38, 42, 0.76);
      --glass-bot-light: rgba(248, 249, 252, 0.66);
      --glass-bot-dark: rgba(24, 24, 28, 0.66);
      --hairline-light: rgba(29, 29, 31, 0.08);
      --hairline-dark: rgba(255, 255, 255, 0.12);
      --card-rim-light: rgba(255, 255, 255, 0.96);
      --card-rim-dark: rgba(255, 255, 255, 0.12);
      --card-ring-light: rgba(0, 0, 0, 0.04);
      --card-ring-dark: rgba(255, 255, 255, 0.08);
      --card-shadow-light: rgba(0, 0, 0, 0.055);
      --card-shadow-dark: rgba(0, 0, 0, 0.56);
      --glow-key-light: rgba(255, 255, 255, 0.96);
      --glow-key-dark: rgba(41, 151, 255, 0.085);
      --glow-sky-light: rgba(212, 229, 252, 0.38);
      --glow-sky-dark: rgba(255, 255, 255, 0.035);
      --sb-thumb-light: rgba(29, 29, 31, 0.24);
      --sb-thumb-dark: rgba(245, 245, 247, 0.28);

      --canvas: var(--canvas-light);
      --surface: var(--surface-light);
      --fg: var(--fg-light);
      --fg2: var(--fg2-light);
      --accent: var(--accent-light);
      --accent-hover: var(--accent-hover-light);
      --danger: var(--danger-light);
      --glass-top: var(--glass-top-light);
      --glass-bot: var(--glass-bot-light);
      --hairline: var(--hairline-light);
      --card-rim: var(--card-rim-light);
      --card-ring: var(--card-ring-light);
      --card-shadow: var(--card-shadow-light);
      --glow-key: var(--glow-key-light);
      --glow-sky: var(--glow-sky-light);
      --sb-thumb: var(--sb-thumb-light);

      accent-color: var(--accent);
      scrollbar-color: var(--sb-thumb) transparent;
    }
    :root[data-theme="dark"],
    :root:has(> head > meta[name="color-scheme"][content="dark"]) { color-scheme: dark; }
    :root[data-theme="light"],
    :root:has(> head > meta[name="color-scheme"][content="light"]) { color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not(:has(> head > meta[name="color-scheme"][content="light"])) {
        --canvas: var(--canvas-dark);
        --surface: var(--surface-dark);
        --fg: var(--fg-dark);
        --fg2: var(--fg2-dark);
        --accent: var(--accent-dark);
        --accent-hover: var(--accent-hover-dark);
        --danger: var(--danger-dark);
        --glass-top: var(--glass-top-dark);
        --glass-bot: var(--glass-bot-dark);
        --hairline: var(--hairline-dark);
        --card-rim: var(--card-rim-dark);
        --card-ring: var(--card-ring-dark);
        --card-shadow: var(--card-shadow-dark);
        --glow-key: var(--glow-key-dark);
        --glow-sky: var(--glow-sky-dark);
        --sb-thumb: var(--sb-thumb-dark);
      }
    }
    :root[data-theme="dark"] {
      --canvas: var(--canvas-dark);
      --surface: var(--surface-dark);
      --fg: var(--fg-dark);
      --fg2: var(--fg2-dark);
      --accent: var(--accent-dark);
      --accent-hover: var(--accent-hover-dark);
      --danger: var(--danger-dark);
      --glass-top: var(--glass-top-dark);
      --glass-bot: var(--glass-bot-dark);
      --hairline: var(--hairline-dark);
      --card-rim: var(--card-rim-dark);
      --card-ring: var(--card-ring-dark);
      --card-shadow: var(--card-shadow-dark);
      --glow-key: var(--glow-key-dark);
      --glow-sky: var(--glow-sky-dark);
      --sb-thumb: var(--sb-thumb-dark);
    }
    @supports (color: light-dark(white, black)) {
      :root {
        --canvas: light-dark(var(--canvas-light), var(--canvas-dark));
        --surface: light-dark(var(--surface-light), var(--surface-dark));
        --fg: light-dark(var(--fg-light), var(--fg-dark));
        --fg2: light-dark(var(--fg2-light), var(--fg2-dark));
        --accent: light-dark(var(--accent-light), var(--accent-dark));
        --accent-hover: light-dark(var(--accent-hover-light), var(--accent-hover-dark));
        --danger: light-dark(var(--danger-light), var(--danger-dark));
        --glass-top: light-dark(var(--glass-top-light), var(--glass-top-dark));
        --glass-bot: light-dark(var(--glass-bot-light), var(--glass-bot-dark));
        --hairline: light-dark(var(--hairline-light), var(--hairline-dark));
        --card-rim: light-dark(var(--card-rim-light), var(--card-rim-dark));
        --card-ring: light-dark(var(--card-ring-light), var(--card-ring-dark));
        --card-shadow: light-dark(var(--card-shadow-light), var(--card-shadow-dark));
        --glow-key: light-dark(var(--glow-key-light), var(--glow-key-dark));
        --glow-sky: light-dark(var(--glow-sky-light), var(--glow-sky-dark));
        --sb-thumb: light-dark(var(--sb-thumb-light), var(--sb-thumb-dark));
      }
    }
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body {
      margin: 0;
      background-color: var(--canvas);
      background-image:
        radial-gradient(1200px 440px at 20% -10%, var(--glow-key) 0%, transparent 66%),
        radial-gradient(880px 400px at 88% -8%, var(--glow-sky) 0%, transparent 62%);
      background-attachment: fixed;
      color: var(--fg);
      font: 14px/1.5 var(--font-sans);
      height: 100dvh;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    body > header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(180deg, var(--glass-top) 0%, var(--glass-bot) 100%);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      padding: 10px 22px;
      border-bottom: 0.5px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-link {
      font-size: 18px;
      font-weight: 700;
      color: var(--fg);
      text-decoration: none;
      letter-spacing: -0.03em;
    }
    .back-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 999px;
      transition: color 0.18s ease, background-color 0.18s ease;
    }
    .back-link:hover {
      color: var(--accent-hover);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .brand-link:focus-visible,
    .back-link:focus-visible,
    .rules-retry-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    body > main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      max-width: 1520px;
      width: 100%;
      margin: 12px auto 16px;
      padding: 0 18px;
    }
    #rules-standalone-root {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 0;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 var(--card-rim),
        0 8px 32px -8px var(--card-shadow),
        0 0 0 0.5px var(--card-ring);
      min-height: 0;
    }
    #rules-standalone-root .rules-studio.app {
      height: 100%;
      max-height: 100%;
    }
    .rules-boot-state {
      padding: 56px 24px;
      text-align: center;
      color: var(--fg2);
    }
    .rules-boot-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--danger);
      margin: 0 0 8px;
      letter-spacing: -0.015em;
    }
    .rules-boot-copy {
      font-size: 13.5px;
      color: var(--fg2);
      margin: 0 0 18px;
    }
    .rules-retry-btn {
      min-height: 38px;
      padding: 8px 22px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #FFFFFF;
      font: 550 13.5px/1 var(--font-sans);
      cursor: pointer;
      transition: background-color 0.18s ease;
    }
    .rules-retry-btn:hover { background: var(--accent-hover); }
    @media (forced-colors: active) {
      #rules-standalone-root { border: 1px solid CanvasText; box-shadow: none; }
    }
    @media (max-width: 760px) {
      body > header { padding: 8px 14px; }
      body > main { margin: 8px auto 10px; padding: 0 8px; }
      #rules-standalone-root { border-radius: 16px; }
    }
    @media print {
      body { height: auto; overflow: visible; }
    }
  </style>
</head>
<body>
  <header>
    <a href="./" class="brand-link">Wayon-edu</a>
    <a href="./" class="back-link">← 返回教学工作台</a>
  </header>
  <main>
    <div id="rules-standalone-root">
      <div class="rules-boot-state">
        <p class="rules-boot-copy" style="margin:0">正在连接统一规则库…</p>
      </div>
    </div>
  </main>
  <script type="module">
    // Loading only: a failure never writes rules; it shows a visible error and a retry.
    const root = document.getElementById('rules-standalone-root');
    const within = (promise, ms) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('TIMEOUT')), ms))]);
    const loadSdk = async () => {
      const sources = [
        './supabase-js-2.49.4.mjs',
        'https://esm.sh/@supabase/supabase-js@2.49.4',
        'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm',
        'https://unpkg.com/@supabase/supabase-js@2.49.4/dist/module/index.js'
      ];
      let last;
      for (const source of sources) {
        try { return await within(import(source), 15000); } catch (error) { last = error; }
      }
      throw last || new Error('SDK_UNAVAILABLE');
    };
    const showLoading = () => {
      const box = document.createElement('div');
      box.className = 'rules-boot-state';
      const copy = document.createElement('p');
      copy.className = 'rules-boot-copy';
      copy.style.margin = '0';
      copy.setAttribute('role', 'status');
      copy.textContent = '正在连接统一规则库…';
      box.append(copy);
      root.replaceChildren(box);
    };
    const showError = () => {
      const box = document.createElement('div');
      box.className = 'rules-boot-state';
      box.setAttribute('role', 'alert');
      const title = document.createElement('p');
      title.className = 'rules-boot-title';
      title.textContent = '无法载入任务规则';
      const copy = document.createElement('p');
      copy.className = 'rules-boot-copy';
      copy.textContent = '网络或云端暂时连不上；规则没有任何改动。请检查网络后重试。';
      const retry = document.createElement('button');
      retry.type = 'button';
      retry.id = 'rules-retry';
      retry.className = 'rules-retry-btn';
      retry.textContent = '重试';
      retry.onclick = load;
      box.append(title, copy, retry);
      root.replaceChildren(box);
    };
    async function load() {
      showLoading();
      try {
        const [{ mountRules }, sdk, response] = await Promise.all([
          within(import('./rules-editor.mjs?v=20261121-07'), 15000),
          loadSdk(),
          within(fetch('./checks-public-config.json', { cache: 'no-store' }), 15000)
        ]);
        if (!response.ok) throw new Error('CONFIG_UNAVAILABLE');
        const config = await response.json();
        const client = sdk.createClient(config.url, config.key);
        await mountRules({
          document,
          client,
          container: root,
          onClose: () => { window.location.href = './'; }
        });
      } catch (error) {
        console.error('Failed to load rules page:', error);
        showError();
      }
    }
    load();
  </script>
</body>
</html>
