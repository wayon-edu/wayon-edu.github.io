  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var isEmbed = params.get('embed') === '1';
        if (!isEmbed) {
          try { isEmbed = window.self !== window.top; } catch (_) { isEmbed = true; }
        }
        if (isEmbed) document.documentElement.setAttribute('data-embed', '1');
        var theme = params.get('theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector && document.querySelector('meta[name="color-scheme"]');
          if (meta) meta.setAttribute('content', theme);
        }
      } catch (_) {}
    })();

    /* ==========================================================================

      overflow: clip;
      scroll-padding-top: 0;
      scroll-padding-bottom: 0;

    html[data-embed="1"] .site-header {
      position: relative;
      block-size: 0;
      padding: 0;

    .btn-cta,

      display: inline-flex;

    @media (prefers-reduced-motion: no-preference) {
      .btn-cta,
      .btn-glass,

          box-shadow 0.2s var(--ease-apple),

    .apple-link {
      display: inline-flex;

      top: 3px;
      left: 0;

  <script>
    (() => {
      'use strict';

      const STORAGE_SYNC_KEY = 'wayon-mock-exams-catalog-v1';

      const $ = (id) => document.getElementById(id);

      function safeReadEmbeddedExams() {
        const el = $('mock-exams-data');

      const EMBEDDED_EXAMS = safeReadEmbeddedExams();

      const state = {

      let announceTimer = null;

      let groupThumbEl = null;
      let groupBarButtons = [];

      let lastGroupSig = '';
      let supportsDisplayTransition;
      const buttonFeedbackTimers = new WeakMap();

      function getParentTargetOrigin() {
        try {
          if (window.location && window.location.origin && window.location.origin !== 'null') {
            return window.location.origin;
          }
        } catch (_) {}
        return '*';
      }

      function measureEmbedHeight() {
        if (!pageRoot) return 0;
        const rectHeight = typeof pageRoot.getBoundingClientRect === 'function'
          ? pageRoot.getBoundingClientRect().height
          : 0;
        const scrollHeight = pageRoot.scrollHeight || 0;
        const offsetHeight = pageRoot.offsetHeight || 0;
        return Math.ceil(Math.max(rectHeight, scrollHeight, offsetHeight));
      }

      function postEmbedHeight(force) {
        if (!isEmbedMode || !window.parent || window.parent === window) return;
        const height = measureEmbedHeight();
        if (!Number.isFinite(height) || height <= 0) return;
        if (!force && height === lastReportedHeight) return;
        lastReportedHeight = height;
        try {
          window.parent.postMessage(
            { type: 'wayon-mocks-height', height: height },
            getParentTargetOrigin()
          );
        } catch (_) {}
      }

      function scheduleEmbedHeightReport(force) {
        if (!isEmbedMode) return;
        if (force) {
          if (embedHeightRaf && typeof window.cancelAnimationFrame === 'function') {
            window.cancelAnimationFrame(embedHeightRaf);
            embedHeightRaf = 0;
          }
          postEmbedHeight(true);
          return;
        }
        if (embedHeightRaf) return;
        if (typeof window.requestAnimationFrame === 'function') {
          let ran = false;
          const rafId = window.requestAnimationFrame(() => {
            ran = true;
            embedHeightRaf = 0;
            postEmbedHeight(false);
          });
          if (!ran) embedHeightRaf = rafId;
        } else {
          postEmbedHeight(false);
        }
      }

      function getEmbedVisibleViewportBand() {
        if (!isEmbedMode) return null;
        try {
          const frameEl = window.frameElement;
          if (!frameEl || !window.parent || window.parent === window) return null;
          const rect = frameEl.getBoundingClientRect();
          const parentVh = window.parent.innerHeight || window.parent.document.documentElement.clientHeight || 0;
          if (!parentVh || !rect.height) return null;
          const top = Math.max(0, -rect.top);
          const bottom = Math.min(rect.height, parentVh - rect.top);
          if (bottom <= top) return null;
          return { top, bottom };
        } catch (_) {
          return null;
        }
      }

      function readStorage(key) {
        try {
          return window.localStorage.getItem(key);
        } catch (_) {
          return null;
        }
      }

      function writeStorage(key, value) {
        try {
          if (value === null) window.localStorage.removeItem(key);
          else window.localStorage.setItem(key, value);
        } catch (_) {}
      }

      function isReducedMotion() {
        return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      }

      function canTransitionDisplay() {
        if (supportsDisplayTransition !== undefined) return supportsDisplayTransition;
        if (
          !window.CSS ||
          typeof window.CSS.supports !== 'function' ||
          !window.CSS.supports('transition-behavior', 'allow-discrete') ||
          !document.body ||
          typeof window.getComputedStyle !== 'function'
        ) {
          supportsDisplayTransition = false;
          return false;
        }
        try {
          const probe = document.createElement('div');
          probe.style.cssText = 'transition: display 1s allow-discrete !important; display: block;';
          document.body.appendChild(probe);
          window.getComputedStyle(probe).display;
          probe.style.display = 'none';
          supportsDisplayTransition = window.getComputedStyle(probe).display === 'block';
          probe.remove();
        } catch (_) {
          supportsDisplayTransition = false;
        }
        return supportsDisplayTransition;
      }

      function supportsTopLayerExit() {
        return Boolean(
          window.CSS &&
          typeof window.CSS.supports === 'function' &&
          window.CSS.supports('overlay', 'auto') &&
          canTransitionDisplay()
        );
      }

      async function waitClosingAnimations(el, maxWaitMs) {
        if (!el || typeof el.getAnimations !== 'function') return;
        try {
          const animations = el.getAnimations({ subtree: true });
          if (animations && animations.length > 0) {
            await Promise.race([
              Promise.allSettled(animations.map((a) => a.finished)),
              new Promise((resolve) => window.setTimeout(resolve, maxWaitMs || 450))
            ]);
          }
        } catch (_) {}
      }

      async function closeDialogAnimated(dialogEl, returnVal) {
        if (!dialogEl || !dialogEl.open) return;
        if (!supportsTopLayerExit() && typeof dialogEl.getAnimations === 'function') {
          dialogEl.setAttribute('data-closing', '');
          await waitClosingAnimations(dialogEl, 450);
          if (!dialogEl.hasAttribute('data-closing')) return;
          dialogEl.removeAttribute('data-closing');
        }
        if (typeof dialogEl.close === 'function') {
          dialogEl.close(returnVal || 'close');
        } else {
          dialogEl.removeAttribute('open');
        }
      }

      function toBase64AsciiSafe(str) {
        try {
          return btoa(str);
        } catch (_) {
          const bytes = new TextEncoder().encode(str);
          let bin = '';
          for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
          return btoa(bin);
        }
      }

      function buildEtUrl(exam, timestamp) {
        const ts = timestamp == null ? Date.now() : timestamp;
        const payload = ATTR_ACCID + ',' + ATTR_ROLE + ',' + exam.relativeExamUrl + ',' + DOMAIN_ALIAS + ',' + ts;
        return ET_URL_PREFIX + encodeURIComponent(toBase64AsciiSafe(payload));
      }

      function buildInvitationText(exam, url, inviterName) {
        const cleanInviter = String(inviterName || '').trim();
        const mins = Number(exam.suggesttimeMinutes) || 0;
        const durationLine = '「' + exam.title + '」预计作答时长：' + mins + ' 分钟';
        const tipLine = '请复制链接在电脑端浏览器完成测试';
        if (cleanInviter) {
          return [url, ORG_NAME, cleanInviter + ' 邀请你参加模考测试', durationLine, tipLine].join('\n');
        }
        return [url, ORG_NAME + ' 邀请你参加模考测试', durationLine, tipLine].join('\n');
      }

      function getStandaloneShareUrl() {
        try {
          const u = new URL(window.location.href);
          u.searchParams.delete('embed');
          u.searchParams.delete('inviter');
          u.searchParams.delete('v');
          u.searchParams.delete('theme');
          u.hash = '';
          return u.toString();
        } catch (_) {
          return window.location.href.split('?')[0].split('#')[0];
        }
      }

      function isValidRelativeExamUrl(url) {
        return typeof url === 'string' && url.startsWith('/') && !url.startsWith('//') && !/[\r\n]/.test(url);
      }

      function inferGroupName(categoryId, categoryName) {
        if (Object.prototype.hasOwnProperty.call(CATEGORY_GROUP_MAP, categoryId)) {
          return CATEGORY_GROUP_MAP[categoryId];
        }
        const name = String(categoryName || '');
        if (/能力|基础|词汇/i.test(name)) return '能力测试';
        if (/SAT|ACT|GRE|GMAT|AP|SSAT|ISEE|A-?Level|IB/i.test(name)) return '升学类';
        return '语言类';
      }

      function normalizeApiCatalog(payload) {
        if (!payload || !Array.isArray(payload.data)) {
          throw new Error('INVALID_CATALOG_PAYLOAD');
        }
        const rawCategories = [];
        for (let i = 0; i < payload.data.length; i++) {
          const cat = payload.data[i];
          if (!cat || typeof cat !== 'object') continue;
          const catId = Number(cat.categoryId);
          const catName = String(cat.categoryName || '').trim();
          if (!catName) continue;
          const groupName = inferGroupName(catId, catName);
          const subGroups = Array.isArray(cat.exams) ? cat.exams : [];
          const catExams = [];
          for (let j = 0; j < subGroups.length; j++) {
            const sg = subGroups[j];
            if (!sg || typeof sg !== 'object') continue;
            const sgName = String(sg.name || '').trim();
            const items = Array.isArray(sg.exams) ? sg.exams : [];
            for (let k = 0; k < items.length; k++) {
              const item = items[k];
              if (!item || typeof item !== 'object') continue;
              if (item.inshow === false) continue;
              const title = String(item.title || '').trim();
              const relUrl = String(item.url || '').trim();
              if (!title || !isValidRelativeExamUrl(relUrl)) continue;
              const structs = Array.isArray(item.structs)
                ? item.structs.map((s) => String(s || '').trim()).filter(Boolean)
                : [];
              catExams.push({
                id: item.id == null ? null : item.id,
                title: title,
                groupName: groupName,
                categoryId: Number.isFinite(catId) ? catId : 0,
                categoryName: catName,
                subGroupName: sgName,
                suggesttimeMinutes: Number(item.suggesttime) || 0,
                structs: structs,
                relativeExamUrl: relUrl,
                source: 'public_api'
              });
            }
          }
          if (catExams.length > 0) {
            rawCategories.push({
              groupName: groupName,
              categoryId: Number.isFinite(catId) ? catId : 9999,
              categoryName: catName,
              originalIndex: i,
              exams: catExams
            });
          }
        }

        const hasVocab = rawCategories.some((c) =>
          c.exams.some((e) => e.relativeExamUrl === '/org/vocabulary/index.html')
        );
        if (!hasVocab) {
          rawCategories.push({
            groupName: BUILTIN_VOCAB_EXAM.groupName,
            categoryId: BUILTIN_VOCAB_EXAM.categoryId,
            categoryName: BUILTIN_VOCAB_EXAM.categoryName,
            originalIndex: 9999,
            exams: [{ ...BUILTIN_VOCAB_EXAM, structs: BUILTIN_VOCAB_EXAM.structs.slice() }]
          });
        }

        rawCategories.sort((a, b) => {
          const ga = GROUP_ORDER.indexOf(a.groupName);
          const gb = GROUP_ORDER.indexOf(b.groupName);
          const gDiff = (ga === -1 ? 99 : ga) - (gb === -1 ? 99 : gb);
          if (gDiff !== 0) return gDiff;
          const ca = CATEGORY_ORDER.indexOf(a.categoryId);
          const cb = CATEGORY_ORDER.indexOf(b.categoryId);
          const cDiff = (ca === -1 ? 999 : ca) - (cb === -1 ? 999 : cb);
          if (cDiff !== 0) return cDiff;
          return a.originalIndex - b.originalIndex;
        });

        const flat = [];
        for (let i = 0; i < rawCategories.length; i++) {
          for (let j = 0; j < rawCategories[i].exams.length; j++) {
            flat.push(rawCategories[i].exams[j]);
          }
        }
        if (flat.length === 0) {
          throw new Error('EMPTY_CATALOG');
        }
        return flat;
      }

      function restoreCachedSyncIfNewer() {
        const raw = readStorage(STORAGE_SYNC_KEY);
        if (!raw) return;
        try {
          const cached = JSON.parse(raw);
          if (
            cached &&
            typeof cached.syncedAt === 'number' &&
            cached.syncedAt > SNAPSHOT_BUILT_AT &&
            Array.isArray(cached.exams) &&
            cached.exams.length > 0 &&
            cached.exams.every((e) => e && typeof e.title === 'string' && isValidRelativeExamUrl(e.relativeExamUrl))
          ) {
            state.exams = cached.exams;
            state.syncedAt = cached.syncedAt;
          }
        } catch (_) {}
      }

      function announceSR(message) {
        if (!message) return;
        if (typeof document.ariaNotify === 'function') {
          try {
            document.ariaNotify(message);
            return;
          } catch (_) {}
        }
        if (!srAnnouncer) return;
        srAnnouncer.textContent = '';
        window.requestAnimationFrame(() => {
          srAnnouncer.textContent = message;
        });
      }

      function createCheckIcon() {
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('class', 'check-svg');
        svg.setAttribute('viewBox', '0 0 16 16');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2.1');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.setAttribute('aria-hidden', 'true');
        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('class', 'check-path');
        path.setAttribute('d', 'M3.2 8.4 6.5 11.7 12.8 4.6');
        svg.appendChild(path);
        return svg;
      }

      function createToastIcon(tone) {
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('viewBox', '0 0 16 16');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2.1');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.setAttribute('aria-hidden', 'true');
        if (tone === 'ok') {
          const p = document.createElementNS(svgNS, 'path');
          p.setAttribute('d', 'M3.2 8.4 6.5 11.7 12.8 4.6');
          svg.appendChild(p);
        } else if (tone === 'warn') {
          const line = document.createElementNS(svgNS, 'path');
          line.setAttribute('d', 'M8 4.4v4.4');
          const dot = document.createElementNS(svgNS, 'circle');
          dot.setAttribute('cx', '8');
          dot.setAttribute('cy', '11.6');
          dot.setAttribute('r', '0.7');
          dot.setAttribute('fill', 'currentColor');
          svg.append(line, dot);
        } else {
          const dot = document.createElementNS(svgNS, 'circle');
          dot.setAttribute('cx', '8');
          dot.setAttribute('cy', '8');
          dot.setAttribute('r', '2.6');
          dot.setAttribute('fill', 'currentColor');
          dot.setAttribute('stroke', 'none');
          svg.appendChild(dot);
        }
        return svg;
      }

      async function dismissToast(toastEl, restoreFocus, immediate) {
        if (!toastEl || !toastEl.isConnected) return;
        if (activeToastTimer) {
          window.clearTimeout(activeToastTimer);
          activeToastTimer = null;
        }
        const hadFocus = toastEl.contains(document.activeElement);
        if (activeToastEl === toastEl) activeToastEl = null;

        if (!immediate && !supportsTopLayerExit() && typeof toastEl.getAnimations === 'function') {
          toastEl.setAttribute('data-closing', '');
          await waitClosingAnimations(toastEl, 380);
          if (!toastEl.isConnected) return;
          toastEl.removeAttribute('data-closing');
        }

        try {
          if (typeof toastEl.hidePopover === 'function' && toastEl.matches && toastEl.matches(':popover-open')) {
            toastEl.hidePopover();
          }
        } catch (_) {}
        toastEl.classList.remove('is-open');
        toastEl.remove();

        if (restoreFocus && hadFocus && lastTriggerBeforeToast && lastTriggerBeforeToast.isConnected) {
          try { lastTriggerBeforeToast.focus({ preventScroll: true }); } catch (_) {}
        }
      }

      function showToast(message, tone) {
        if (!message) return;
        // Per persistent-toast-notifications guidance: do not show toasts while a modal dialog is open
        if (fallbackDialog && fallbackDialog.open) return;

        if (activeToastEl) void dismissToast(activeToastEl, false, true);
        lastTriggerBeforeToast = document.activeElement instanceof HTMLElement ? document.activeElement : null;

        const effectiveTone = tone || 'info';
        const toast = document.createElement('div');
        toast.className = 'toast-item';
        toast.dataset.tone = effectiveTone;
        toast.setAttribute('popover', 'manual');

        const badge = document.createElement('span');
        badge.className = 'toast-badge';
        badge.setAttribute('aria-hidden', 'true');
        badge.appendChild(createToastIcon(effectiveTone));

        const msgSpan = document.createElement('span');
        msgSpan.className = 'toast-msg';
        msgSpan.textContent = message;

        const closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'toast-close';
        closeBtn.setAttribute('aria-label', '关闭通知');
        closeBtn.textContent = '✕';
        closeBtn.addEventListener('click', () => { void dismissToast(toast, true, false); });

        toast.append(badge, msgSpan, closeBtn);
        const visibleBand = getEmbedVisibleViewportBand();
        if (visibleBand) {
          toast.style.top = Math.max(visibleBand.top + 16, Math.round(visibleBand.bottom - 62)) + 'px';
          toast.style.bottom = 'auto';
        }
        toastRegion.appendChild(toast);
        activeToastEl = toast;

        if (typeof toast.showPopover === 'function') {
          try {
            toast.showPopover();
          } catch (_) {
            toast.classList.add('is-open');
          }
        } else {
          toast.classList.add('is-open');
        }

        announceSR(message);

        const scheduleAutoDismiss = () => {
          if (activeToastTimer) window.clearTimeout(activeToastTimer);
          activeToastTimer = window.setTimeout(() => {
            if (toast.contains(document.activeElement)) return;
            void dismissToast(toast, false, false);
          }, 3000);
        };

        toast.addEventListener('focusin', () => {
          if (activeToastTimer) {
            window.clearTimeout(activeToastTimer);
            activeToastTimer = null;
          }
        });
        toast.addEventListener('focusout', () => {
          window.setTimeout(() => {
            if (toast.isConnected && !toast.contains(document.activeElement)) {
              scheduleAutoDismiss();
            }
          }, 50);
        });

        scheduleAutoDismiss();
      }

      function execCommandCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '-9999px';
        ta.style.fontSize = '16px';
        document.body.appendChild(ta);
        let ok = false;
        try {
          ta.focus({ preventScroll: true });
          ta.select();
          ta.setSelectionRange(0, text.length);
          ok = document.execCommand('copy');
        } catch (_) {
          ok = false;
        } finally {
          document.body.removeChild(ta);
        }
        return ok;
      }

      async function copyTextWithFallback(text, dialogTitle) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function' && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (_) {
            // Fall through to execCommand
          }
        }
        if (execCommandCopy(text)) {
          return true;
        }
        openManualCopyDialog(text, dialogTitle || '手动复制内容');
        return false;
      }

      function openManualCopyDialog(text, title) {
        if (activeToastEl) void dismissToast(activeToastEl, false, true);
        fallbackDialog.removeAttribute('data-closing');
        fallbackDialogTitle.textContent = title;
        fallbackTextarea.value = text;
        fallbackRetryBtn.textContent = '全选并重试复制';
        const visibleBand = getEmbedVisibleViewportBand();
        if (visibleBand) {
          fallbackDialog.style.top = Math.round(visibleBand.top + Math.max(16, (visibleBand.bottom - visibleBand.top - 320) / 2)) + 'px';
          fallbackDialog.style.marginTop = '0';
        } else {
          fallbackDialog.style.top = '';
          fallbackDialog.style.marginTop = '';
        }
        if (typeof fallbackDialog.showModal === 'function') {
          if (!fallbackDialog.open) fallbackDialog.showModal();
        } else {
          fallbackDialog.setAttribute('open', '');
        }
        window.requestAnimationFrame(() => {
          fallbackTextarea.focus({ preventScroll: true });
          fallbackTextarea.select();
          try { fallbackTextarea.setSelectionRange(0, text.length); } catch (_) {}
        });
      }

      function flashButtonFeedback(btn, labelText) {
        if (!btn) return;
        const labelSpan = btn.querySelector('span') || btn;
        if (!btn.dataset.origLabel) {
          btn.dataset.origLabel = labelSpan.textContent;
        }
        const prevTimer = buttonFeedbackTimers.get(btn);
        if (prevTimer) window.clearTimeout(prevTimer);

        btn.classList.add('is-copied');
        labelSpan.textContent = labelText;

        const timer = window.setTimeout(() => {
          btn.classList.remove('is-copied');
          if (btn.dataset.origLabel) labelSpan.textContent = btn.dataset.origLabel;
          buttonFeedbackTimers.delete(btn);
        }, 2200);
        buttonFeedbackTimers.set(btn, timer);
      }

      function flashAnimatedCheckFeedback(btn, copiedLabel, origLabel) {
        if (!btn) return;
        const prevTimer = buttonFeedbackTimers.get(btn);
        if (prevTimer) window.clearTimeout(prevTimer);

        btn.classList.add('is-copied');
        const labelSpan = document.createElement('span');
        labelSpan.textContent = copiedLabel;
        btn.replaceChildren(createCheckIcon(), labelSpan);

        const timer = window.setTimeout(() => {
          btn.classList.remove('is-copied');
          const restoreSpan = document.createElement('span');
          restoreSpan.textContent = origLabel;
          btn.replaceChildren(restoreSpan);
          buttonFeedbackTimers.delete(btn);
        }, 2200);
        buttonFeedbackTimers.set(btn, timer);
      }

      function buildSearchHaystack(exam) {
        const catLower = String(exam.categoryName || '').toLowerCase();
        const synonym = SEARCH_SYNONYMS[catLower] || '';
        return [
          exam.title,
          exam.categoryName,
          exam.groupName,
          exam.subGroupName,
          Array.isArray(exam.structs) ? exam.structs.join(' ') : '',
          synonym
        ].join(' ').toLowerCase();
      }

      function getGroupStats() {
        const counts = new Map();
        for (let i = 0; i < GROUP_ORDER.length; i++) counts.set(GROUP_ORDER[i], 0);
        for (let i = 0; i < state.exams.length; i++) {
          const g = state.exams[i].groupName;
          counts.set(g, (counts.get(g) || 0) + 1);
        }
        const rows = [{ name: '全部', count: state.exams.length }];
        counts.forEach((count, name) => {
          if (count > 0) rows.push({ name, count });
        });
        return rows;
      }

      function getCategoryStats() {
        const map = new Map();
        for (let i = 0; i < state.exams.length; i++) {
          const ex = state.exams[i];
          if (state.group !== '全部' && ex.groupName !== state.group) continue;
          const key = ex.categoryName;
          if (!map.has(key)) {
            map.set(key, {
              categoryId: ex.categoryId,
              categoryName: ex.categoryName,
              groupName: ex.groupName,
              count: 0
            });
          }
          map.get(key).count++;
        }
        return Array.from(map.values());
      }

      function getFilteredExams() {
        const tokens = state.query.trim().toLowerCase().split(/\s+/).filter(Boolean);
        return state.exams.filter((exam) => {
          if (state.group !== '全部' && exam.groupName !== state.group) return false;
          if (state.category && exam.categoryName !== state.category) return false;
          if (tokens.length > 0) {
            const hay = buildSearchHaystack(exam);
            for (let i = 0; i < tokens.length; i++) {
              if (!hay.includes(tokens[i])) return false;
            }
          }
          return true;
        });
      }

      function syncUrlFromState() {
        try {
          if (window.location.protocol !== 'http:' && window.location.protocol !== 'https:') return;
          const u = new URL(window.location.href);
          if (state.group && state.group !== '全部') u.searchParams.set('group', state.group);
          else u.searchParams.delete('group');
          if (state.category) u.searchParams.set('cat', state.category);
          else u.searchParams.delete('cat');
          if (state.query.trim()) u.searchParams.set('q', state.query.trim());
          else u.searchParams.delete('q');
          window.history.replaceState(null, '', u.toString());
        } catch (_) {}
      }

      function updateMetaChips() {
        const total = state.exams.length;
        if (heroTotalBadge) heroTotalBadge.textContent = total + ' 套模考';

        const cleanInviter = state.inviter.trim();
        if (cleanInviter) {
          inviterChip.hidden = false;
          inviterChip.textContent = '邀请人：' + cleanInviter;
        } else {
          inviterChip.hidden = true;
          inviterChip.textContent = '';
        }

        if (state.syncedAt) {
          syncChip.dataset.tone = 'ok';
          syncChipText.textContent = '已同步 · ' + total + ' 套';
        } else {
          syncChip.dataset.tone = 'idle';
          syncChipText.textContent = '内嵌快照 · ' + total + ' 套';
        }
      }

      function syncGroupThumb(animate) {
        if (!groupBar || !groupThumbEl || !activeGroupBtn) return;
        if (!groupThumbEl.style || typeof groupThumbEl.style.setProperty !== 'function') return;
        const left = activeGroupBtn.offsetLeft;
        const width = activeGroupBtn.offsetWidth;
        if (!Number.isFinite(left) || !Number.isFinite(width) || width <= 0) return;
        if (!animate) groupBar.classList.remove('is-ready');
        groupThumbEl.style.setProperty('--seg-x', left + 'px');
        groupThumbEl.style.setProperty('--seg-w', width + 'px');
        groupThumbEl.style.opacity = '1';
        groupBar.classList.add('is-thumb-placed');
        if (!animate) {
          if (typeof window.requestAnimationFrame === 'function') {
            window.requestAnimationFrame(() => groupBar.classList.add('is-ready'));
          } else {
            groupBar.classList.add('is-ready');
          }
        }
      }

      function renderFilterBars(animateThumb) {
        const groups = getGroupStats();
        const groupSig = groups.map((g) => g.name + ':' + g.count).join('|');
        if (groupSig === lastGroupSig && groupBarButtons.length === groups.length) {
          activeGroupBtn = null;
          for (let i = 0; i < groupBarButtons.length; i++) {
            const btn = groupBarButtons[i];
            const isActive = state.group === btn.dataset.groupName;
            btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            if (isActive) activeGroupBtn = btn;
          }
          syncGroupThumb(Boolean(animateThumb));
        } else {
          lastGroupSig = groupSig;
          if (!groupThumbEl) {
            groupThumbEl = document.createElement('span');
            groupThumbEl.className = 'seg-thumb';
            groupThumbEl.setAttribute('aria-hidden', 'true');
          }
          const groupFrag = document.createDocumentFragment();
          groupBarButtons = [];
          activeGroupBtn = null;
          for (let i = 0; i < groups.length; i++) {
            const g = groups[i];
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'pill pill-group';
            const isActive = state.group === g.name;
            btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            btn.dataset.groupName = g.name;

            const label = document.createElement('span');
            label.textContent = g.name;
            const count = document.createElement('span');
            count.className = 'pill-count';
            count.textContent = String(g.count);

            btn.append(label, count);
            btn.addEventListener('click', () => {
            if (state.group === g.name && !state.category) return;
            state.group = g.name;
            state.category = '';
            syncUrlFromState();
            renderAll(true, true);
            });
            if (isActive) activeGroupBtn = btn;
            groupBarButtons.push(btn);
            groupFrag.appendChild(btn);
          }
          groupBar.replaceChildren(groupThumbEl, groupFrag);
          if (typeof window.requestAnimationFrame === 'function') {
            window.requestAnimationFrame(() => syncGroupThumb(false));
          } else {
            syncGroupThumb(false);
          }
        }

        const catFrag = document.createDocumentFragment();
        const cats = getCategoryStats();
        let activeCatBtn = null;
        for (let i = 0; i < cats.length; i++) {
          const c = cats[i];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'pill pill-cat';
          const isActive = state.category === c.categoryName;
          btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
          btn.dataset.catName = c.categoryName;

          const label = document.createElement('span');
          label.textContent = c.categoryName;
          const count = document.createElement('span');
          count.className = 'pill-count';
          count.textContent = String(c.count);

          btn.append(label, count);
          btn.addEventListener('click', () => {
            state.category = state.category === c.categoryName ? '' : c.categoryName;
            syncUrlFromState();
            renderAll(true, false);
          });
          if (isActive) activeCatBtn = btn;
          catFrag.appendChild(btn);
        }
        catStrip.replaceChildren(catFrag);

        if (activeCatBtn && typeof activeCatBtn.scrollIntoView === 'function') {
          try {
            activeCatBtn.scrollIntoView({
              behavior: isReducedMotion() ? 'auto' : 'smooth',
              inline: 'nearest',
              block: 'nearest'
            });
          } catch (_) {}
        }
      }

      function renderCards(shouldAnnounceCount) {
        const filtered = getFilteredExams();
        const total = state.exams.length;
        const hasFilter = state.group !== '全部' || Boolean(state.category) || Boolean(state.query.trim());

        resultCountEl.textContent = hasFilter
          ? '显示 ' + filtered.length + ' / ' + total + ' 套模考'
          : '共 ' + total + ' 套模考';

        if (filtered.length === 0) {

          announceTimer = window.setTimeout(() => {

          }, 260);

      function renderAll(shouldAnnounceCount, animateThumb) {
        updateMetaChips();
        renderFilterBars(Boolean(animateThumb));
        renderCards(Boolean(shouldAnnounceCount));
      }

      function resetFilters() {
        state.group = '全部';
        state.category = '';
        state.query = '';
        searchInput.value = '';
        searchClear.hidden = true;
        syncUrlFromState();
        renderAll(true, true);
      }

      function setSyncLoading(loading) {
        state.syncing = loading;
        for (let i = 0; i < syncButtons.length; i++) {
          const btn = syncButtons[i];
          btn.setAttribute('aria-busy', loading ? 'true' : 'false');
          btn.disabled = loading;
          btn.classList.toggle('is-spinning', loading);
          const lbl = btn.querySelector('[data-sync-label="1"]');
          if (lbl) lbl.textContent = loading ? '同步中…' : '同步最新';
        }
      }

      async function syncLatestCatalog() {
        if (state.syncing) return;
        setSyncLoading(true);
        const controller = typeof AbortController === 'function' ? new AbortController() : null;
        const timer = controller ? window.setTimeout(() => controller.abort(), 10000) : null;
        try {
          const resp = await fetch(PUBLIC_API_URL, {
            method: 'GET',
            cache: 'no-store',
            headers: { Accept: 'application/json' },
            signal: controller ? controller.signal : undefined
          });
          if (!resp.ok) throw new Error('HTTP_' + resp.status);
          const payload = await resp.json();
          const normalized = normalizeApiCatalog(payload);
          const now = Date.now();
          state.exams = normalized;
          state.syncedAt = now;
          writeStorage(STORAGE_SYNC_KEY, JSON.stringify({ syncedAt: now, exams: normalized }));

          if (state.category && !state.exams.some((e) => e.categoryName === state.category)) {
            state.category = '';
          }
          if (state.group !== '全部' && !state.exams.some((e) => e.groupName === state.group)) {
            state.group = '全部';
          }

          renderAll(false, false);
          showToast('已同步最新 · ' + normalized.length + ' 套模考', 'ok');
        } catch (_) {
          syncChip.dataset.tone = 'warn';
          syncChipText.textContent = '离线快照 · ' + state.exams.length + ' 套';
          showToast('同步失败，已保留当前 ' + state.exams.length + ' 套本地快照', 'warn');
        } finally {
          if (timer) window.clearTimeout(timer);
          setSyncLoading(false);
        }
      }

      function initFromUrlAndStorage() {
        restoreCachedSyncIfNewer();

        const params = new URLSearchParams(window.location.search);
        const rawHash = (window.location.hash || '').replace(/^#/, '');
        const hashParams = rawHash.includes('=') ? new URLSearchParams(rawHash) : null;

        // Inviter priority: URL ?inviter=... > localStorage
        const urlInviter = (params.get('inviter') || '').trim();
        const savedInviter = (readStorage(STORAGE_INVITER_KEY) || '').trim();
        state.inviter = urlInviter || savedInviter;
        inviterInput.value = state.inviter;
        inviterClear.hidden = !state.inviter;

        // Search query
        const urlQuery = (params.get('q') || '').trim();
        if (urlQuery) {
          state.query = urlQuery;
          searchInput.value = urlQuery;
          searchClear.hidden = false;
        }

        // Group filter
        const urlGroup = (params.get('group') || (hashParams ? hashParams.get('group') : '') || '').trim();
        if (urlGroup && state.exams.some((e) => e.groupName === urlGroup)) {
          state.group = urlGroup;
        }

        // Category filter (?cat=雅思 or ?cat=9 or #cat=雅思 or #雅思)
        let catRaw = (
          params.get('cat') ||
          params.get('category') ||
          (hashParams ? hashParams.get('cat') || hashParams.get('category') : '') ||
          ''
        ).trim();
        if (!catRaw && rawHash && !rawHash.includes('=')) {
          try { catRaw = decodeURIComponent(rawHash).trim(); } catch (_) { catRaw = rawHash.trim(); }
        }
        if (catRaw) {
          const matchByName = state.exams.find((e) => e.categoryName.toLowerCase() === catRaw.toLowerCase());
          const matchById = /^\d+$/.test(catRaw)
            ? state.exams.find((e) => String(e.categoryId) === catRaw)
            : null;
          const matched = matchByName || matchById;
          if (matched) {
            state.category = matched.categoryName;
            if (state.group !== '全部' && matched.groupName !== state.group) {
              state.group = matched.groupName;
            }
          }
        }
      }

      function applyExternalTheme(theme) {
        const meta = typeof document.querySelector === 'function'
          ? document.querySelector('meta[name="color-scheme"]')
          : null;
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
          if (meta) meta.setAttribute('content', theme);
        } else if (theme === 'auto') {
          document.documentElement.removeAttribute('data-theme');
          if (meta) meta.setAttribute('content', 'light dark');
        }
      }

      function bindEvents() {
        // Keyboard Left / Right / Home / End navigation for segmented group bar
        groupBar.addEventListener('keydown', (event) => {
          const idx = groupBarButtons.indexOf(document.activeElement);
          if (idx === -1) return;
          let next = idx;
          if (event.key === 'ArrowRight') next = (idx + 1) % groupBarButtons.length;
          else if (event.key === 'ArrowLeft') next = (idx - 1 + groupBarButtons.length) % groupBarButtons.length;
          else if (event.key === 'Home') next = 0;
          else if (event.key === 'End') next = groupBarButtons.length - 1;
          else return;
          event.preventDefault();
          groupBarButtons[next].focus();
          groupBarButtons[next].click();
        });

        // Search input (with IME-safe Enter handling)
        searchInput.addEventListener('input', () => {
          state.query = searchInput.value;
          searchClear.hidden = !state.query;
          syncUrlFromState();
          renderCards(true);
        });

        searchInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            if (event.isComposing || event.keyCode === 229) return;
            searchInput.blur();
          } else if (event.key === 'Escape' && state.query) {
            event.preventDefault();
            state.query = '';
            searchInput.value = '';
            searchClear.hidden = true;
            syncUrlFromState();
            renderCards(true);
          }
        });

        searchClear.addEventListener('click', () => {
          state.query = '';
          searchInput.value = '';
          searchClear.hidden = true;
          syncUrlFromState();
          renderCards(true);
          searchInput.focus({ preventScroll: true });
        });

        // Inviter input (with IME-safe Enter handling)
        inviterInput.addEventListener('input', () => {
          state.inviter = inviterInput.value;
          inviterClear.hidden = !state.inviter;
          writeStorage(STORAGE_INVITER_KEY, state.inviter.trim() || null);
          updateMetaChips();
        });

        inviterInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            if (event.isComposing || event.keyCode === 229) return;
            inviterInput.blur();
            const clean = state.inviter.trim();
            showToast(clean ? '已设置邀请人：' + clean : '已恢复默认通用邀请文案', 'info');
          }
        });

        inviterClear.addEventListener('click', () => {
          state.inviter = '';
          inviterInput.value = '';
          inviterClear.hidden = true;
          writeStorage(STORAGE_INVITER_KEY, null);
          updateMetaChips();
          inviterInput.focus({ preventScroll: true });
        });

        resetBtn.addEventListener('click', resetFilters);

        if (sharePageBtn) {
          sharePageBtn.addEventListener('click', async () => {
            const shareUrl = getStandaloneShareUrl();
            const ok = await copyTextWithFallback(shareUrl, '复制同事分享链接');
            if (ok) {
              flashButtonFeedback(sharePageBtn, '✓ 已复制本页链接');
              showToast('已复制本页链接，可直接发给同事使用', 'ok');
            }
          });
        }

        for (let i = 0; i < syncButtons.length; i++) {
          syncButtons[i].addEventListener('click', syncLatestCatalog);
        }

        // Manual copy dialog controls & animated top-layer exit + Safari closedby="any" fallback
        fallbackCloseX.addEventListener('click', () => { void closeDialogAnimated(fallbackDialog, 'close'); });
        fallbackDialog.addEventListener('cancel', (event) => {
          if (!supportsTopLayerExit()) {
            event.preventDefault();
            void closeDialogAnimated(fallbackDialog, 'cancel');
          }
        });
        const fallbackForm = typeof fallbackDialog.querySelector === 'function'
          ? fallbackDialog.querySelector('form[method="dialog"]')
          : null;
        if (fallbackForm) {
          fallbackForm.addEventListener('submit', (event) => {
            if (!supportsTopLayerExit()) {
              event.preventDefault();
              void closeDialogAnimated(fallbackDialog, 'close');
            }
          });
        }
        fallbackDialog.addEventListener('close', () => {
          fallbackDialog.removeAttribute('data-closing');
          fallbackDialog.returnValue = '';
          fallbackDialog.style.top = '';
          fallbackDialog.style.marginTop = '';
        });

        fallbackRetryBtn.addEventListener('click', () => {
          const text = fallbackTextarea.value;
          fallbackTextarea.focus({ preventScroll: true });
          fallbackTextarea.select();
          try { fallbackTextarea.setSelectionRange(0, text.length); } catch (_) {}
          const ok = execCommandCopy(text);
          if (ok) {
            void closeDialogAnimated(fallbackDialog, 'copied');
            showToast('已复制到剪贴板', 'ok');
          } else {
            fallbackRetryBtn.textContent = '已全选，请长按复制';
          }
        });

        if (typeof HTMLDialogElement !== 'undefined' && !('closedBy' in HTMLDialogElement.prototype)) {
          const isOutside = (e, dlg) => {
            const r = dlg.getBoundingClientRect();
            return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
          };
          let pressedOutside = false;
          fallbackDialog.addEventListener('pointerdown', (e) => {
            pressedOutside = isOutside(e, fallbackDialog);
          });
          fallbackDialog.addEventListener('pointerup', (e) => {
            if (pressedOutside && isOutside(e, fallbackDialog)) {
              void closeDialogAnimated(fallbackDialog, 'backdrop');
            }
            pressedOutside = false;
          });
        }

        // Observe inner content root (.page) — never documentElement — so iframe height updates cannot feed back into a growth loop.
        if (isEmbedMode) {
          if (typeof ResizeObserver === 'function' && pageRoot) {
            const ro = new ResizeObserver(() => {
              syncGroupThumb(false);
              scheduleEmbedHeightReport(false);
            });
            ro.observe(pageRoot);
          }
          window.addEventListener('resize', () => {
            syncGroupThumb(false);
            scheduleEmbedHeightReport(false);
          });
          window.addEventListener('load', () => {
            syncGroupThumb(false);
            scheduleEmbedHeightReport(true);
          });
          if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
            document.fonts.ready.then(() => {
              syncGroupThumb(false);
              scheduleEmbedHeightReport(false);
            }).catch(() => {});
          }
        } else {
          window.addEventListener('resize', () => syncGroupThumb(false));
          window.addEventListener('load', () => syncGroupThumb(false));
          if (document.fonts && document.fonts.ready && typeof document.fonts.ready.then === 'function') {
            document.fonts.ready.then(() => syncGroupThumb(false)).catch(() => {});
          }
        }

        // Parent postMessage: theme synchronization & on-demand embed height re-measurement
        window.addEventListener('message', (event) => {
          const expectedOrigin = getParentTargetOrigin();
          if (expectedOrigin !== '*' && event.origin && event.origin !== expectedOrigin) return;
          const data = event && event.data;
          if (!data || typeof data !== 'object') return;
          if (data.type === 'wayon-mocks-measure') {
            scheduleEmbedHeightReport(true);
            return;
          }
          if (data.type !== 'wayon-theme') return;
          applyExternalTheme(data.theme);
        });
      }

      initFromUrlAndStorage();
      bindEvents();
      renderAll(false, false);
    })();
  </script>
</body>
</html>
